apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-app
  annotations:
    # Tell Traefik to use the HTTP entrypoint
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-app
                port:
                  number: 80
